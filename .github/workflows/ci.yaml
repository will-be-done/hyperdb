name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hyperdb-lib:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: TypeCheck
        run: bun run ts

      - name: Install Playwright browsers
        run: cd apps/hyperdb-lib && bun run playwright install --with-deps chromium

      - name: Test
        run: bun run test

      - name: Check import cycles
        run: bun run lint:cycles

  hyperdb-doc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build docs
        run: bun run --filter='hyperdb-doc' build
