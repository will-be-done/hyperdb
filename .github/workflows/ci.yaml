name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

  hyperdb:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: TypeCheck
        run: pnpm run ts

      - name: Install Playwright browsers
        run: pnpm --filter '@will-be-done/hyperdb' exec playwright install --with-deps chromium

      - name: Test
        run: pnpm run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('packages/hyperdb/coverage/coverage-summary.json') != '' }}
        run: |
          node -e '
            const { total } = require("./packages/hyperdb/coverage/coverage-summary.json");
            const rows = ["statements", "branches", "functions", "lines"].map(
              (key) => `| ${key} | ${total[key].pct}% | ${total[key].covered}/${total[key].total} |`,
            );
            console.log(["### @will-be-done/hyperdb coverage", "", "| Metric | % | Covered |", "| --- | --- | --- |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('packages/hyperdb/coverage/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hyperdb-coverage
          path: packages/hyperdb/coverage
          retention-days: 14

      - name: Check import cycles
        run: pnpm run lint:cycles

  hyperdb-doc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter '@will-be-done/hyperdb-doc' build
